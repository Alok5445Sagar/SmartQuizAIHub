spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=TestSecretKeyForJWTTokenGenerationInTestEnvironment2024VeryLong
app.jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:3000

spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=servlet
logging.level.com.smartquiz=WARN

# AI config — dummy values, AIService is mocked in tests
app.ai.api-url=https://example.openai.azure.com/openai/deployments/test/chat/completions?api-version=2024-06-01
app.ai.api-key=test-key
app.ai.model=test-deployment
app.ai.similarity-threshold=0.30