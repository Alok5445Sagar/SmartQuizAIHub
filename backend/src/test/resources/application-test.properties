# Datasource is supplied by BaseTest: TEST_DB_URL/TEST_DB_USERNAME/TEST_DB_PASSWORD when set,
# otherwise a Testcontainers MySQL. Flyway builds the schema; Hibernate validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

app.jwt.secret=TestSecretKeyForJWTTokenGenerationInTestEnvironment2024VeryLong
app.jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:3000

spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=servlet
logging.level.com.smartquiz=WARN

# AI: no Ollama in tests. AIService is mocked in TestConfig.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.ollama.init.pull-model-strategy=never
app.ai.model=test-model
app.ai.similarity-threshold=0.30

# Keep test uploads out of the source tree
app.chat.attachments.dir=${java.io.tmpdir}/smartquiz-test-attachments

# Tests create reference data inside rolled-back transactions; a cache would keep stale rows.
# ReferenceCacheTest turns it back on.
spring.cache.type=none
