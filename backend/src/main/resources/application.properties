server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------
# All secrets come from environment variables. See /.env.example.
# For local development run with SPRING_PROFILES_ACTIVE=dev.
# ------------------------------------------------------------------

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_quiz_hub?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by Flyway (db/migration). Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Lets Flyway adopt a database created earlier by ddl-auto=update (V1/V2 are idempotent).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Hikari pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=20000

# JWT (JWT_SECRET is required and must be at least 32 bytes)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:7200000}
app.jwt.issuer=${JWT_ISSUER:smart-quiz-hub}
app.jwt.audience=${JWT_AUDIENCE:smart-quiz-hub-api}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.chat.attachments.dir=${CHAT_ATTACHMENTS_DIR:backend-data/chat-attachments}

# Rate limits (in-memory, per instance)
app.rate-limit.login-failures-per-minute=${LOGIN_FAILURES_PER_MINUTE:5}
app.rate-limit.chat-messages-per-minute=${CHAT_MESSAGES_PER_MINUTE:30}

# CORS / public links
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.quiz.public-base-url=${QUIZ_PUBLIC_BASE_URL:http://localhost:3000}

logging.level.com.smartquiz=INFO

# AI - local Ollama (CPU-friendly defaults)
app.ai.model=${OLLAMA_MODEL:qwen2.5:3b}
app.ai.num-ctx=${OLLAMA_NUM_CTX:8192}
app.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1200}
app.ai.similarity-threshold=0.30
app.ai.generate-use-ai-similarity=false
app.ai.generate-retry-multiplier=4
app.ai.generate-min-attempts=4
# Fault tolerance (CPU inference: one call at a time, short bounded queue)
app.ai.max-concurrent=${AI_MAX_CONCURRENT:1}
app.ai.queue-size=${AI_QUEUE_SIZE:5}
app.ai.queue-wait=${AI_QUEUE_WAIT:180s}
app.ai.call-timeout=${AI_CALL_TIMEOUT:300s}
app.ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
app.ai.retry.wait=500ms
app.ai.circuit.failure-rate=50
app.ai.circuit.minimum-calls=4
app.ai.circuit.sliding-window=10
app.ai.circuit.open-wait=${AI_CIRCUIT_OPEN_WAIT:30s}

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${app.ai.model}
spring.ai.ollama.chat.options.num-ctx=${app.ai.num-ctx}
spring.ai.ollama.init.pull-model-strategy=${OLLAMA_PULL_STRATEGY:when_missing}
spring.ai.ollama.init.timeout=${OLLAMA_PULL_TIMEOUT:15m}
spring.ai.ollama.init.max-retries=1
# Embeddings are not used
spring.ai.model.embedding=none
# CPU inference is slow; allow long reads from Ollama
spring.http.client.connect-timeout=${AI_CONNECT_TIMEOUT:10s}
spring.http.client.read-timeout=${AI_READ_TIMEOUT:300s}

# Health: Ollama is reported separately and never takes the app out of readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,UP,DEGRADED,UNKNOWN
management.endpoint.health.status.http-mapping.DEGRADED=200