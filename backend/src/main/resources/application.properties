server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------------
# All secrets come from environment variables. See /.env.example.
# For local development run with SPRING_PROFILES_ACTIVE=dev.
# ------------------------------------------------------------------

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_quiz_hub?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Hikari pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=20000

# JWT (JWT_SECRET is required and must be at least 32 bytes)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS / public links
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.quiz.public-base-url=${QUIZ_PUBLIC_BASE_URL:http://localhost:3000}

logging.level.com.smartquiz=INFO

# AI
app.ai.api-url=${AZURE_OPENAI_ENDPOINT:}
app.ai.api-key=${AZURE_OPENAI_API_KEY:}
app.ai.model=gpt-4.1-mini
app.ai.provider=azure-openai
app.ai.openai-compatible.chat-path=/chat/completions
app.ai.similarity-threshold=0.30
app.ai.timeout-seconds=300
app.ai.generate-use-ai-similarity=false
app.ai.generate-retry-multiplier=4
app.ai.generate-min-attempts=4
app.ai.max-output-tokens=1200
spring.ai.azure.openai.endpoint=${app.ai.api-url}
spring.ai.azure.openai.api-key=${app.ai.api-key}
spring.ai.azure.openai.api-version=2024-12-01-preview
spring.ai.azure.openai.chat.options.deployment-name=${app.ai.model}
spring.ai.azure.openai.chat.options.max-tokens=800
app.ai.fallback-model=
