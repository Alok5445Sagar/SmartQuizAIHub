server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_quiz_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=REMOVED_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=REMOVED_JWT_SECRET
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=http://localhost:3000

logging.level.com.smartquiz=INFO

# Ollama Local AI Configuration
app.ai.api-url=http://localhost:11434/api/generate
app.ai.model=llama3
app.ai.similarity-threshold=0.70
