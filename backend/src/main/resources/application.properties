server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_quiz_hub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=REMOVED_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hikari pool settings to reduce connection starvation on long-lived requests
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=20000
spring.jpa.open-in-view=false

# Hikari pool settings to avoid starvation on long-lived requests (e.g. SSE)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=20000

# JWT Configuration
app.jwt.secret=REMOVED_JWT_SECRET
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=http://localhost:3000
app.quiz.public-base-url=http://localhost:3000

logging.level.com.smartquiz=INFO

# Azure OpenAI Configuration
app.ai.api-url=https://removed-ai-endpoint.invalid/openai
app.ai.api-key=REMOVED_AI_API_KEY
app.ai.model=gpt-4.1-mini
app.ai.provider=azure-openai
app.ai.openai-compatible.chat-path=/chat/completions
app.ai.similarity-threshold=0.30
app.ai.timeout-seconds=300
app.ai.generate-use-ai-similarity=false
app.ai.generate-retry-multiplier=4
app.ai.generate-min-attempts=4
app.ai.max-output-tokens=1200

# Spring AI wiring (uses the existing app.ai.* values above)
# Hackathon guide endpoint (APIM gateway path includes /openai)
spring.ai.azure.openai.endpoint=${app.ai.api-url}
spring.ai.azure.openai.api-key=${app.ai.api-key}
spring.ai.azure.openai.api-version=2024-12-01-preview
spring.ai.azure.openai.chat.options.deployment-name=${app.ai.model}
spring.ai.azure.openai.chat.options.max-tokens=800
spring.ai.azure.openai.embedding.options.deployment-name=text-embedding-ada-002
app.ai.fallback-model=
